[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3gpp-rag-backend"
version = "0.1.0"
description = "FastAPI backend for a 3GPP standards RAG pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pgvector>=0.3.6",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.3.0",
  "pypdf>=4.2.0",
  "google-genai>=0.6.0",
  "pytest>=8.2.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
